[tool.pytest.ini_options]
markers = [
    "live: tests that require a running Minecraft server on localhost:4712",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.black]
skip-string-normalization=true
exclude = '''
(
  /(
      \.eggs|
      \.git|
      \.hg|
      \.mypy_cache|
      \.nox|
      \.tox|
      \.venv|
      build|
      protos|
      dist
  )/
)
'''
